<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-CIPHER HUD — Color Channel Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #ff00ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        .control-panel {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .control-panel h2 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        button {
            background: #1a1a2e;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: all 0.2s;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        button:hover {
            background: #00ff88;
            color: #0a0e27;
            text-shadow: none;
        }
        
        button.active {
            background: #00ff88;
            color: #0a0e27;
            border-color: #00ff88;
        }
        
        .file-input-wrapper {
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            color: #00ff88;
        }
        
        input[type="file"]::file-selector-button {
            background: #1a1a2e;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }
        
        input[type="file"]::file-selector-button:hover {
            background: #00ff88;
            color: #0a0e27;
        }
        
        .viewer {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ff00ff;
            padding: 15px;
            border-radius: 5px;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #00ff88;
            max-width: 100%;
            height: auto;
        }
        
        .info-panel {
            background: rgba(255, 0, 136, 0.1);
            border: 2px solid #ff00ff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .info-panel p {
            margin-bottom: 8px;
        }
        
        .label {
            color: #ff00ff;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ OMNI-CIPHER HUD — Image Color Analysis</h1>
        
        <div class="control-panel">
            <h2>File Upload & Channel Controls</h2>
            
            <div class="file-input-wrapper">
                <label class="label">Load Image:</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            
            <div>
                <label class="label">Color Channel Isolation:</label>
                <div class="button-group">
                    <button id="btn-rgb">Full RGB</button>
                    <button id="btn-red">Red Only</button>
                    <button id="btn-green">Green Only</button>
                    <button id="btn-blue">Blue Only</button>
                    <button id="btn-alpha">Alpha Channel</button>
                </div>
            </div>
            
            <div>
                <label class="label">Pixel Transformations:</label>
                <div class="button-group">
                    <button id="btn-invert">Invert Colors</button>
                    <button id="btn-lsb-red">LSB (Red)</button>
                    <button id="btn-lsb-green">LSB (Green)</button>
                    <button id="btn-lsb-blue">LSB (Blue)</button>
                </div>
            </div>
            
            <div>
                <label class="label">Bit Plane Extraction:</label>
                <div class="button-group">
                    <button id="btn-bit0">Bit 0 (LSB)</button>
                    <button id="btn-bit1">Bit 1</button>
                    <button id="btn-bit2">Bit 2</button>
                    <button id="btn-bit3">Bit 3</button>
                    <button id="btn-bit4">Bit 4</button>
                    <button id="btn-bit5">Bit 5</button>
                    <button id="btn-bit6">Bit 6</button>
                    <button id="btn-bit7">Bit 7 (MSB)</button>
                </div>
            </div>
        </div>
        
        <div class="viewer">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
        
        <div class="info-panel">
            <span class="label">Image Information:</span>
            <p>Width: <span id="info-width">—</span> px</p>
            <p>Height: <span id="info-height">—</span> px</p>
            <p>Mode: <span id="info-mode">—</span></p>
            <p>Status: <span id="info-status">Ready. Load an image to begin.</span></p>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentImageData = null;
        let originalImageData = null;
        let currentMode = 'rgb';
        
        const infoWidth = document.getElementById('info-width');
        const infoHeight = document.getElementById('info-height');
        const infoMode = document.getElementById('info-mode');
        const infoStatus = document.getElementById('info-status');
        
        // File upload handler
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    infoWidth.textContent = img.width;
                    infoHeight.textContent = img.height;
                    infoMode.textContent = 'RGBA';
                    infoStatus.textContent = 'Image loaded. Select channel or transformation.';
                    currentMode = 'rgb';
                    updateAllButtons();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        
        function updateAllButtons() {
            document.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('active');
            });
            switch(currentMode) {
                case 'rgb': document.getElementById('btn-rgb').classList.add('active'); break;
                case 'red': document.getElementById('btn-red').classList.add('active'); break;
                case 'green': document.getElementById('btn-green').classList.add('active'); break;
                case 'blue': document.getElementById('btn-blue').classList.add('active'); break;
                case 'alpha': document.getElementById('btn-alpha').classList.add('active'); break;
                case 'invert': document.getElementById('btn-invert').classList.add('active'); break;
                case 'lsb-red': document.getElementById('btn-lsb-red').classList.add('active'); break;
                case 'lsb-green': document.getElementById('btn-lsb-green').classList.add('active'); break;
                case 'lsb-blue': document.getElementById('btn-lsb-blue').classList.add('active'); break;
            }
        }
        
        function applyChannelFilter(mode) {
            if (!originalImageData) return;
            
            currentImageData = ctx.createImageData(originalImageData);
            const data = currentImageData.data;
            const origData = originalImageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = origData[i];
                const g = origData[i + 1];
                const b = origData[i + 2];
                const a = origData[i + 3];
                
                switch(mode) {
                    case 'rgb':
                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;
                        data[i + 3] = a;
                        break;
                    case 'red':
                        data[i] = r;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                        data[i + 3] = a;
                        break;
                    case 'green':
                        data[i] = 0;
                        data[i + 1] = g;
                        data[i + 2] = 0;
                        data[i + 3] = a;
                        break;
                    case 'blue':
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = b;
                        data[i + 3] = a;
                        break;
                    case 'alpha':
                        data[i] = a;
                        data[i + 1] = a;
                        data[i + 2] = a;
                        data[i + 3] = 255;
                        break;
                    case 'invert':
                        data[i] = 255 - r;
                        data[i + 1] = 255 - g;
                        data[i + 2] = 255 - b;
                        data[i + 3] = a;
                        break;
                }
            }
            
            ctx.putImageData(currentImageData, 0, 0);
        }
        
        function applyLSBExtraction(channel) {
            if (!originalImageData) return;
            
            currentImageData = ctx.createImageData(originalImageData);
            const data = currentImageData.data;
            const origData = originalImageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let value = 0;
                if (channel === 'red') value = origData[i];
                else if (channel === 'green') value = origData[i + 1];
                else if (channel === 'blue') value = origData[i + 2];
                
                // Extract LSB and amplify for visibility
                const lsb = (value & 1) ? 255 : 0;
                data[i] = lsb;
                data[i + 1] = lsb;
                data[i + 2] = lsb;
                data[i + 3] = 255;
            }
            
            ctx.putImageData(currentImageData, 0, 0);
        }
        
        function applyBitPlaneExtraction(bitIndex) {
            if (!originalImageData) return;
            
            currentImageData = ctx.createImageData(originalImageData);
            const data = currentImageData.data;
            const origData = originalImageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                // Extract bit at bitIndex from all channels combined
                const r = (origData[i] >> bitIndex) & 1;
                const g = (origData[i + 1] >> bitIndex) & 1;
                const b = (origData[i + 2] >> bitIndex) & 1;
                
                // Amplify for visibility
                const val = (r || g || b) ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 255;
            }
            
            ctx.putImageData(currentImageData, 0, 0);
        }
        
        // Channel filter buttons
        document.getElementById('btn-rgb').addEventListener('click', () => {
            currentMode = 'rgb';
            applyChannelFilter('rgb');
            infoStatus.textContent = 'Full RGB display.';
            updateAllButtons();
        });
        
        document.getElementById('btn-red').addEventListener('click', () => {
            currentMode = 'red';
            applyChannelFilter('red');
            infoStatus.textContent = 'Red channel isolated.';
            updateAllButtons();
        });
        
        document.getElementById('btn-green').addEventListener('click', () => {
            currentMode = 'green';
            applyChannelFilter('green');
            infoStatus.textContent = 'Green channel isolated.';
            updateAllButtons();
        });
        
        document.getElementById('btn-blue').addEventListener('click', () => {
            currentMode = 'blue';
            applyChannelFilter('blue');
            infoStatus.textContent = 'Blue channel isolated.';
            updateAllButtons();
        });
        
        document.getElementById('btn-alpha').addEventListener('click', () => {
            currentMode = 'alpha';
            applyChannelFilter('alpha');
            infoStatus.textContent = 'Alpha channel displayed.';
            updateAllButtons();
        });
        
        document.getElementById('btn-invert').addEventListener('click', () => {
            currentMode = 'invert';
            applyChannelFilter('invert');
            infoStatus.textContent = 'Colors inverted.';
            updateAllButtons();
        });
        
        // LSB extraction buttons
        document.getElementById('btn-lsb-red').addEventListener('click', () => {
            currentMode = 'lsb-red';
            applyLSBExtraction('red');
            infoStatus.textContent = 'Red channel LSB (Bit 0) extracted.';
            updateAllButtons();
        });
        
        document.getElementById('btn-lsb-green').addEventListener('click', () => {
            currentMode = 'lsb-green';
            applyLSBExtraction('green');
            infoStatus.textContent = 'Green channel LSB (Bit 0) extracted.';
            updateAllButtons();
        });
        
        document.getElementById('btn-lsb-blue').addEventListener('click', () => {
            currentMode = 'lsb-blue';
            applyLSBExtraction('blue');
            infoStatus.textContent = 'Blue channel LSB (Bit 0) extracted.';
            updateAllButtons();
        });
        
        // Bit plane extraction buttons
        for (let bit = 0; bit <= 7; bit++) {
            document.getElementById(`btn-bit${bit}`).addEventListener('click', () => {
                applyBitPlaneExtraction(bit);
                infoStatus.textContent = `Bit ${bit} plane extracted from all RGB channels.`;
            });
        }
    </script>
</body>
</html>
